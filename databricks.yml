# This is a Declarative Automation Bundle definition for retail_etl.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: retail_etl
  uuid: 554f28e7-7879-4bdf-b795-131ecc9552ec

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  bronze_schema:
    description: Bronze schema to use
  silver_schema:
    description: Silver schema to use
  gold_schema:
    description: Gold schema to use
  raw_data_root_path:
    description: Root raw data folder path to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405608811042444.4.azuredatabricks.net
    variables:
      catalog: dtbrretaildev
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      raw_data_root_path: /Volumes/dtbrretaildev/raw
  prod:
    mode: production
    workspace:
      host: https://adb-7405608811042444.4.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/solgas80@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/solgas80@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dtbrretailprod
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      raw_data_root_path: /Volumes/dtbrretailprod/bronze/raw
    permissions:
      - user_name: solgas80@gmail.com
        level: CAN_MANAGE
